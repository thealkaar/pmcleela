<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>पी एम सी Web Companion</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #07080c;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .phone-frame {
      width: 100%;
      max-width: 420px;
      height: 720px;
      background: #0c0e17;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .header {
      padding: 14px 16px;
      background: #0f121e;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .partner-info { display: flex; align-items: center; gap: 10px; }
    .avatar-box {
      position: relative;
      width: 38px; height: 38px; border-radius: 50%;
      background: #1b1f30; display: flex; align-items: center;
      justify-content: center; font-size: 18px;
    }
    /* Gender Glow Indicators: Girl=Green, Boy=Red */
    .green-dot {
      position: absolute; top: 0; right: 0; width: 10px; height: 10px;
      border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;
      border: 1.5px solid #0c0e17;
      animation: blink 1.2s infinite ease-in-out;
    }
    .red-dot {
      position: absolute; top: 0; right: 0; width: 10px; height: 10px;
      border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444;
      border: 1.5px solid #0c0e17;
      animation: blink 1.2s infinite ease-in-out;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .name { font-weight: 700; font-size: 15px; }
    .status { font-size: 11px; color: #10b981; }
    .btn {
      padding: 6px 12px; border-radius: 14px; border: none;
      font-weight: 700; cursor: pointer; font-size: 12px;
    }
    .btn-next { background: rgba(244, 114, 182, 0.15); color: #f472b6; border: 1px solid rgba(244, 114, 182, 0.3); }
    .btn-red { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .chat-body {
      flex: 1; padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    .bubble {
      max-width: 78%; padding: 10px 14px; border-radius: 16px;
      font-size: 14px; line-height: 1.4; word-break: break-word;
    }
    .bubble-me {
      align-self: flex-end; background: #be185d; color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-stranger {
      align-self: flex-start; background: #161926; color: #f1f5f9;
      border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05);
    }
    .bubble-img { max-width: 100%; border-radius: 10px; margin-top: 4px; display: block; }
    .time { font-size: 10px; opacity: 0.7; text-align: right; margin-top: 4px; }
    .lobby {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 24px;
    }
    .input-bar {
      padding: 10px 14px; background: #0f121e; border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; gap: 8px; align-items: center;
    }
    .input-bar input[type="text"] {
      flex: 1; background: #161a29; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 10px 16px; color: #fff; outline: none;
    }
    .file-btn {
      background: #161a29; border: 1px solid rgba(255,255,255,0.08); color: #94a3b8;
      border-radius: 50%; width: 36px; height: 36px; display: flex;
      align-items: center; justify-content: center; cursor: pointer;
    }
    .send-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: #db2777; border: none; color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .gender-select {
      display: flex; gap: 10px; margin-bottom: 16px;
    }
    .gender-label {
      padding: 8px 16px; border-radius: 12px; background: #141726;
      border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 13px;
    }
    .gender-label input { margin-right: 6px; }
  </style>
</head>
<body>

  <div class="phone-frame">
    <!-- Header -->
    <div class="header">
      <div class="partner-info">
        <div class="avatar-box" id="avatarBox">
          👤
          <div id="genderDot"></div>
        </div>
        <div>
          <div class="name" id="partnerName">पी एम सी Lobby</div>
          <div class="status" id="partnerStatus">Web Companion</div>
        </div>
      </div>
      <div id="headerActions" style="display: none; gap: 6px;">
        <button class="btn btn-next" onclick="nextPartner()">Agla</button>
        <button class="btn btn-red" onclick="endChat()">End</button>
      </div>
    </div>

    <!-- Lobby View -->
    <div class="lobby" id="lobbyView">
      <h2 style="font-size: 24px; margin-bottom: 6px; letter-spacing: 0.5px;">पी एम सी</h2>
      <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">
        Piya Milan Chauraha • Anonymous Matching
      </p>

      <div style="margin-bottom: 14px; text-align: left; width: 100%; max-width: 280px;">
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px;">Your Gender:</div>
        <div class="gender-select">
          <label class="gender-label">
            <input type="radio" name="gender" value="female" checked> Female (Pink Dot)
          </label>
          <label class="gender-label">
            <input type="radio" name="gender" value="male"> Male (Black Dot)
          </label>
        </div>

        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px;">Your Anonymous Name:</div>
        <input type="text" id="customAliasInput" value="Campus Visitor" style="width: 100%; background: #141726; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 8px 12px; color: #fff; margin-bottom: 16px;">
      </div>

      <button class="btn" style="background: #db2777; color: #fff; padding: 14px 32px; font-size: 15px; border-radius: 24px; width: 100%; max-width: 280px;" onclick="startSearch()" id="searchBtn">
        Start Searching
      </button>
    </div>

    <!-- Active Chat View -->
    <div class="chat-body" id="chatBody" style="display: none;"></div>

    <div id="typingIndicator" style="display: none; font-size: 11px; color: #f472b6; padding: 0 16px 4px; font-style: italic;">
      Stranger is typing...
    </div>

    <!-- Input Bar -->
    <div class="input-bar" id="inputBar" style="display: none;">
      <label class="file-btn" title="Send Photo">
        📷
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="sendImage(event)">
      </label>
      <input type="text" id="msgInput" placeholder="Type message..." onkeydown="handleKey(event)" oninput="handleTyping()">
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>

  <script>
    const socket = io();
    let myAlias = '';
    let partnerAlias = '';
    let partnerGender = '';
    let typingTimeout;

    function getSelectedGender() {
      const radios = document.getElementsByName('gender');
      for (const r of radios) {
        if (r.checked) return r.value;
      }
      return 'female';
    }

    socket.on('matched', (data) => {
      myAlias = data.yourAlias;
      partnerAlias = data.partnerAlias;
      partnerGender = data.partnerGender;
      
      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('chatBody').style.display = 'flex';
      document.getElementById('inputBar').style.display = 'flex';
      document.getElementById('headerActions').style.display = 'flex';

      document.getElementById('partnerName').innerText = partnerAlias + (partnerGender === 'female' ? ' (F)' : ' (M)');
      document.getElementById('partnerStatus').innerText = 'Online';
      
      // Update Gender Dot:
      // Female (Girl): Green glowing dot
      // Male (Boy): Red glowing dot
      const dot = document.getElementById('genderDot');
      if (partnerGender === 'female') {
        dot.className = 'green-dot';
      } else {
        dot.className = 'red-dot';
      }

      document.getElementById('chatBody').innerHTML = '';
    });

    socket.on('receive_message', (msg) => {
      appendMessage(msg.text, false, msg.timestamp, msg.image);
    });

    socket.on('partner_typing', ({ isTyping }) => {
      document.getElementById('typingIndicator').style.display = isTyping ? 'block' : 'none';
    });

    socket.on('partner_disconnected', (data) => {
      wipeAndReset(data.reason || 'Partner disconnected.');
    });

    function startSearch() {
      const gender = getSelectedGender();
      const alias = document.getElementById('customAliasInput').value.trim() || 'Campus Visitor';
      socket.emit('search_partner', { gender, preferredAlias: alias });
      document.getElementById('searchBtn').innerText = 'Searching...';
    }

    function nextPartner() {
      const gender = getSelectedGender();
      const alias = document.getElementById('customAliasInput').value.trim() || 'Campus Visitor';
      wipeAndReset('Skipping to next student...');
      socket.emit('next_partner', { gender, preferredAlias: alias });
    }

    function endChat() {
      socket.emit('leave_chat');
      wipeAndReset('You ended the chat session.');
    }

    function wipeAndReset(notice) {
      document.getElementById('chatBody').innerHTML = '';
      document.getElementById('chatBody').style.display = 'none';
      document.getElementById('inputBar').style.display = 'none';
      document.getElementById('headerActions').style.display = 'none';
      document.getElementById('lobbyView').style.display = 'flex';
      document.getElementById('searchBtn').innerText = 'Start Searching';
      document.getElementById('partnerName').innerText = 'पी एम सी Lobby';
      document.getElementById('partnerStatus').innerText = 'Web Companion';
      document.getElementById('genderDot').className = '';
      document.getElementById('typingIndicator').style.display = 'none';
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      appendMessage(text, true, time);
      socket.emit('send_message', { text });
      input.value = '';
      socket.emit('typing_status', { isTyping: false });
    }

    function sendImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64 = evt.target.result;
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        appendMessage(null, true, time, base64);
        socket.emit('send_image', { image: base64 });
      };
      reader.readAsDataURL(file);
    }

    function appendMessage(text, isMe, time, imageSrc) {
      const chatBody = document.getElementById('chatBody');
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (isMe ? 'bubble-me' : 'bubble-stranger');

      let content = '';
      if (text) content += `<div>${escapeHtml(text)}</div>`;
      if (imageSrc) content += `<img src="${imageSrc}" class="bubble-img" />`;
      content += `<div class="time">${time} ${isMe ? '✓✓' : ''}</div>`;

      bubble.innerHTML = content;
      chatBody.appendChild(bubble);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMsg();
    }

    function handleTyping() {
      socket.emit('typing_status', { isTyping: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('typing_status', { isTyping: false });
      }, 1500);
    }

    function escapeHtml(string) {
      const div = document.createElement('div');
      div.innerText = string;
      return div.innerHTML;
    }
  </script>
</body>
</html>
