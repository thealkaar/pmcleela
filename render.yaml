services:
  - type: web
    name: pmc-leela-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MAX_UPLOAD_MB
        value: "90"
      - key: JSON_BODY_LIMIT
        value: 10mb
