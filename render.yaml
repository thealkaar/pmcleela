services:
  - type: web
    name: pmc-leela-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: JSON_BODY_LIMIT
        value: 10mb
      - key: DATABASE_URL
        sync: false
      - key: B2_BUCKET_NAME
        value: pmcleela
      - key: B2_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com
      - key: B2_REGION
        value: us-east-005
      - key: B2_SIGNED_URL_TTL_SECONDS
        value: "43200"
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
